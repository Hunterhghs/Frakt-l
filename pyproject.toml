[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraktal"
version = "0.1.0"
description = "Fraktál — Fable 5 × Grok 4.5 hybrid AI coding agent. High-performance multi-agent orchestration powered by DeepSeek API. Plan → Design → Implement → Review pipeline with persistent memory, MCP server, and domain playbooks for specialized outputs (websites, dashboards, reports)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hunter Hughes", email = "hunter@hheuristics.com" }]
keywords = [
    "ai", "coding-agent", "deepseek", "fable", "grok", "orchestration",
    "multi-agent", "mcp", "reasoning", "code-generation", "dashboard",
    "website-builder", "fraktal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.55.0",
    "rich>=13.0",
    "click>=8.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
fraktal = "fraktal.cli:main"

[project.urls]
Homepage = "https://github.com/Hunterhghs/Frakt-l"
Repository = "https://github.com/Hunterhghs/Frakt-l.git"
Issues = "https://github.com/Hunterhghs/Frakt-l/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraktal = ["agents/definitions/*.md", "agents/personas/*.toml", "agents/roles/*.toml", "skills/*/SKILL.md", "prompts/*.md", "playbooks/*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
